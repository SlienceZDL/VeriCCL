[pytest]
addopts = --strict-markers
testpaths = tests
markers =
    phase01: Phase 01 foundation, input, and semantics tests.
    phase02: Phase 02 topology and planning tests.
    phase03: Phase 03 solving and composition tests.
    phase04: Phase 04 buffer planning and XML tests.
    phase05: Phase 05 offline verification and tuning tests.
    phase06: Phase 06 online calibration and tracing tests.
    phase07: Phase 07 integration and acceptance tests.
    gurobi: Tests that require Gurobi and a valid license.
    hardware: Tests that require collective communication hardware.
